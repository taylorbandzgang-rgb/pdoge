# Add inside the existing 443 server block for 34.148.123.122.nip.io,
# alongside the RPC location. Exposes the faucet API at
# https://34.148.123.122.nip.io/faucet/claim and /faucet/health.
location /faucet/ {
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
}
